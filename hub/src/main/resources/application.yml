spring:
  application:
    name: hub
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/agent_platform?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

server:
  port: 8080
  error:
    include-message: always

agent-platform:
  data-dir: ./data
  skills-dir: ../skills
  skill-script-timeout-ms: 15000
  master-key: ${AGENT_PLATFORM_MASTER_KEY:}
